[project]
name = "onchainbrief"
version = "0.0.1"
description = "Watches Solana mainnet, turns notable on-chain events into a sourced brief + visual, attests on-chain."
requires-python = ">=3.10"
dependencies = [
    "requests==2.33.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "eth-account==0.13.7",
    "solana==0.36.12",
    "solders==0.27.1",
    "websockets==15.0.1",
    "Pillow==12.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Third-party deprecation noise (pytest-asyncio on Python 3.14) drowns the
# "N passed" line; our own code raises none. Keep the suite output readable.
filterwarnings = [
    "ignore::DeprecationWarning",
]
