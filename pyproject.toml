[project]
name = "onchainbrief"
version = "0.0.1"
description = "Watches Solana mainnet, turns notable on-chain events into a sourced brief + visual, attests on-chain."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "eth-account>=0.13",
    "solana>=0.34",
    "solders>=0.21",
    "websockets>=12.0",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
