# Railway deploy config.
# Nixpacks auto-detects Python from requirements.txt / pyproject.toml.
# Build renders the static feed (cold-start safe: emits a valid page even
# with zero briefs). Start re-renders then serves over the platform $PORT.
#
# The curated launch feed (briefs/ + site/) is committed, so the build bakes
# a real page and a fresh deploy serves the feed immediately. A persistent
# volume is optional — only for runtime-added on-demand briefs or horizontal
# scale: point BRIEFS_DIR + SITE_HTML + SITE_DIR at the mount (e.g.
# /data/briefs and /data/site) and the start step re-renders from whatever
# briefs the volume holds, including any added by paid on-demand requests.

[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && python scripts/build_site.py"

[deploy]
startCommand = "python scripts/build_site.py && python scripts/serve_feed.py"
restartPolicyType = "always"
